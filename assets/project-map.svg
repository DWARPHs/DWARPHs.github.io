  <a href="https://github.com/DWARPHs/DWARPHs.github.io" target="_blank" rel="noopener">
  <title>DWARPHs.github.io: https://github.com/DWARPHs/DWARPHs.github.io</title>
  <rect class="repo" x="1405" y="200" width="215" height="95" rx="12"/>
  <text class="t" x="1421" y="228">DWARPHs.github.io</text>
  <text class="s" x="1421" y="250">documentation of every</text>
  <text class="s" x="1421" y="269">part + figure scripts</text>
  </a>
  <a href="https://doi.org/10.5281/zenodo.24164026" target="_blank" rel="noopener">
  <title>Dataset v1.0: https://doi.org/10.5281/zenodo.24164026</title>
  <rect class="published" x="1405" y="330" width="215" height="95" rx="12"/>
  <text class="tag" x="1421" y="352">ZENODO</text>
  <text class="t" x="1421" y="371">Dataset v1.0</text>
  <text class="s" x="1421" y="393">13,581 images + masks</text>
  <text class="m" x="1421" y="412">10.5281/zenodo.24164026</text>
  </a>
  <rect class="planned" x="1405" y="460" width="215" height="95" rx="12"/>
  <text class="t" x="1421" y="488">DWARPH-manuscript</text>
  <text class="s" x="1421" y="510">proposed: paper, analyses</text>
  <text class="s" x="1421" y="529">and figures, reproducible</text>
