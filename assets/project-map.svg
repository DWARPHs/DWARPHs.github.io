<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How the DWARPH project fits together</title>
  <style>a { cursor: pointer; }</style>
  <!-- generated by scripts/make_project_map.py from figures/project-map.yml: edit those, not this -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .col { font-size: 15px; font-weight: 700; fill: #8a929c; letter-spacing: .08em; }
      .repo { fill: #ffffff; stroke: #3f8f29; stroke-width: 2.5; }
      .data { fill: #eef4fb; stroke: #4a78a8; stroke-width: 2; }
      .published { fill: #f5effa; stroke: #7a5aa6; stroke-width: 2; }
      .planned { fill: #ffffff; stroke: #9aa2ab; stroke-width: 2; stroke-dasharray: 7 5; }
      .old { fill: #f3f4f5; stroke: #c3c8cd; stroke-width: 1.5; }
      .t { font-size: 17px; font-weight: 700; fill: #1d2228; }
      .s { font-size: 13.5px; fill: #4a525c; }
      .b { font-size: 13.5px; fill: #4a525c; font-weight: 700; }
      .m { font-size: 13px; fill: #4a525c; font-family: ui-monospace, 'DejaVu Sans Mono', monospace; }
      .flow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .uses { stroke: #5b6470; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .l { font-size: 12.5px; fill: #5b6470; font-style: italic; }
      .tag { font-size: 11.5px; font-weight: 700; fill: #7a5aa6; }
      .rule { stroke: #dfe3e7; }
      a rect { transition: stroke-width .15s; }
      a:hover rect, a:focus rect { stroke-width: 4; }
      a:hover .t, a:focus .t { text-decoration: underline; }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#ffffff"/>
  <text class="col" x="40" y="40">BUILD</text>
  <text class="col" x="300" y="40">RUN</text>
  <text class="col" x="575" y="40">COLLECT</text>
  <text class="col" x="870" y="40">ANALYSE</text>
  <text class="col" x="1150" y="40">SHARE</text>
  <a href="https://github.com/DWARPHs/DWARPH-hardware" target="_blank" rel="noopener">
  <title>DWARPH-hardware: https://github.com/DWARPHs/DWARPH-hardware</title>
  <rect class="repo" x="40" y="70" width="210" height="110" rx="12"/>
  <text class="t" x="56" y="98">DWARPH-hardware</text>
  <text class="s" x="56" y="120">PCBs, 3D-printed parts,</text>
  <text class="s" x="56" y="139">parts list</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-firmware/tree/dwarph-qc/tools/dwarph_qc" target="_blank" rel="noopener">
  <title>DWARPH-QC: https://github.com/DWARPHs/DWARPH-firmware/tree/dwarph-qc/tools/dwarph_qc</title>
  <rect class="planned" x="40" y="250" width="210" height="130" rx="12"/>
  <text class="t" x="56" y="278">DWARPH-QC</text>
  <text class="s" x="56" y="300">planned, in DWARPH-firmware:</text>
  <text class="s" x="56" y="319">after flashing, a guided</text>
  <text class="s" x="56" y="338">check over USB; a device</text>
  <text class="s" x="56" y="357">runs only once QC&#x27;d</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-firmware" target="_blank" rel="noopener">
  <title>DWARPH device: https://github.com/DWARPHs/DWARPH-firmware</title>
  <rect class="repo" x="300" y="70" width="220" height="310" rx="12"/>
  <text class="t" x="316" y="98">DWARPH device</text>
  <text class="s" x="316" y="120">running DWARPH-firmware</text>
  <line class="rule" x1="316" y1="134" x2="504" y2="134"/>
  <text class="s" x="316" y="159">follows its schedule</text>
  <text class="s" x="316" y="178">heats, lights (red, blue,</text>
  <text class="s" x="316" y="197">white)</text>
  <text class="s" x="316" y="221">takes a picture every</text>
  <text class="s" x="316" y="240">few minutes</text>
  <text class="s" x="316" y="264">writes pictures + their</text>
  <text class="s" x="316" y="283">conditions to its SD card</text>
  <text class="s" x="316" y="307">keeps running on its own</text>
  <text class="m" x="316" y="348">schedule.json</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-commander" target="_blank" rel="noopener">
  <title>DWARPH-commander: https://github.com/DWARPHs/DWARPH-commander</title>
  <rect class="repo" x="575" y="70" width="240" height="150" rx="12"/>
  <text class="t" x="591" y="98">DWARPH-commander</text>
  <text class="s" x="591" y="120">desktop app for the fleet</text>
  <line class="rule" x1="591" y1="134" x2="799" y2="134"/>
  <text class="s" x="591" y="159">finds devices, live view</text>
  <text class="s" x="591" y="178">sends schedules, start/stop</text>
  <text class="s" x="591" y="197">light calibration, updates</text>
  </a>
  <rect class="data" x="575" y="285" width="240" height="95" rx="12"/>
  <text class="t" x="591" y="313">Device mirror</text>
  <text class="s" x="591" y="335">copy of every SD card</text>
  <text class="m" x="591" y="354">&lt;device&gt;/&lt;day&gt;/*.jpg+.json</text>
  <rect class="planned" x="575" y="445" width="240" height="95" rx="12"/>
  <text class="t" x="591" y="473">DWARPH_DB</text>
  <text class="s" x="591" y="495">local catalogue and viewer</text>
  <text class="s" x="591" y="514">not on GitHub yet</text>
  <a href="https://github.com/DWARPHs/DWARPH-CV" target="_blank" rel="noopener">
  <title>DWARPH-CV: https://github.com/DWARPHs/DWARPH-CV</title>
  <rect class="repo" x="870" y="70" width="230" height="470" rx="12"/>
  <text class="t" x="886" y="98">DWARPH-CV</text>
  <text class="s" x="886" y="120">Python package, dwarph-cv</text>
  <line class="rule" x1="886" y1="134" x2="1084" y2="134"/>
  <text class="m" x="886" y="159">annotate</text>
  <text class="s" x="886" y="178">SAM 2.1 → ground-truth masks</text>
  <text class="m" x="886" y="209">train</text>
  <text class="s" x="886" y="228">masks → model weights</text>
  <text class="m" x="886" y="259">segment</text>
  <text class="s" x="886" y="278">pictures → duckweed masks</text>
  <text class="m" x="886" y="309">ring</text>
  <text class="s" x="886" y="328">camera distance and tilt</text>
  <text class="m" x="886" y="359">ring-coverage</text>
  <text class="s" x="886" y="378">% of the ring covered</text>
  <text class="s" x="886" y="397">= growth over time</text>
  <line class="rule" x1="886" y1="411" x2="1084" y2="411"/>
  <text class="m" x="886" y="436">tools/build_dataset.py</text>
  <text class="s" x="886" y="455">curated images + masks</text>
  <text class="s" x="886" y="474">→ dataset zip</text>
  </a>
  <a href="https://doi.org/10.5281/zenodo.24164133" target="_blank" rel="noopener">
  <title>Model weights v1.0: https://doi.org/10.5281/zenodo.24164133</title>
  <rect class="published" x="1150" y="70" width="215" height="95" rx="12"/>
  <text class="tag" x="1166" y="92">ZENODO</text>
  <text class="t" x="1166" y="111">Model weights v1.0</text>
  <text class="s" x="1166" y="133">unet_r34_duckweed</text>
  <text class="m" x="1166" y="152">10.5281/zenodo.24164133</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPHs.github.io" target="_blank" rel="noopener">
  <title>DWARPHs.github.io: https://github.com/DWARPHs/DWARPHs.github.io</title>
  <rect class="repo" x="1150" y="200" width="215" height="95" rx="12"/>
  <text class="t" x="1166" y="228">DWARPHs.github.io</text>
  <text class="s" x="1166" y="250">documentation of every</text>
  <text class="s" x="1166" y="269">part + figure scripts</text>
  </a>
  <a href="https://doi.org/10.5281/zenodo.24164026" target="_blank" rel="noopener">
  <title>Dataset v1.0: https://doi.org/10.5281/zenodo.24164026</title>
  <rect class="published" x="1150" y="330" width="215" height="95" rx="12"/>
  <text class="tag" x="1166" y="352">ZENODO</text>
  <text class="t" x="1166" y="371">Dataset v1.0</text>
  <text class="s" x="1166" y="393">13,581 images + masks</text>
  <text class="m" x="1166" y="412">10.5281/zenodo.24164026</text>
  </a>
  <rect class="planned" x="1150" y="460" width="215" height="95" rx="12"/>
  <text class="t" x="1166" y="488">DWARPH-manuscript</text>
  <text class="s" x="1166" y="510">proposed: paper, analyses</text>
  <text class="s" x="1166" y="529">and figures, reproducible</text>
  <rect class="planned" x="575" y="610" width="525" height="64" rx="10"/>
  <text class="b" x="591" y="636">Planned: online hub</text>
  <text class="s" x="591" y="655">Commanders sync to a server; shared dashboard and API</text>
