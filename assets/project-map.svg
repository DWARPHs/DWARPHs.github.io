<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 800" width="1660" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How the DWARPH project fits together</title>
  <style>a { cursor: pointer; }</style>
  <!-- generated by scripts/make_project_map.py from figures/project-map.yml: edit those, not this -->
