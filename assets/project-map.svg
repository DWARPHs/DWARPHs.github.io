  <a href="https://github.com/DWARPHs/DWARPH-hardware" target="_blank" rel="noopener">
  <title>DWARPH-hardware: https://github.com/DWARPHs/DWARPH-hardware</title>
  <rect class="repo" x="40" y="70" width="210" height="110" rx="12"/>
  <text class="t" x="56" y="98">DWARPH-hardware</text>
  <text class="s" x="56" y="120">PCBs, 3D-printed parts,</text>
  <text class="s" x="56" y="139">parts list</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-firmware" target="_blank" rel="noopener">
  <title>DWARPH-firmware: https://github.com/DWARPHs/DWARPH-firmware</title>
  <rect class="repo" x="40" y="215" width="210" height="165" rx="12"/>
  <text class="t" x="56" y="243">DWARPH-firmware</text>
  <text class="s" x="56" y="265">ESP32-S3: schedule,</text>
  <text class="s" x="56" y="284">heater, lights, camera,</text>
  <text class="s" x="56" y="303">SD card, API</text>
  <line class="rule" x1="56" y1="317" x2="234" y2="317"/>
  <text class="s" x="56" y="342">includes DWARPH-QC</text>
  <text class="m" x="56" y="361">tools/dwarph_qc</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-firmware/tree/dwarph-qc/tools/dwarph_qc" target="_blank" rel="noopener">
  <title>DWARPH-QC: https://github.com/DWARPHs/DWARPH-firmware/tree/dwarph-qc/tools/dwarph_qc</title>
  <rect class="planned" x="290" y="70" width="210" height="310" rx="12"/>
  <text class="tag tag-planned" x="306" y="92">PART OF DWARPH-FIRMWARE</text>
  <text class="t" x="306" y="111">DWARPH-QC</text>
  <text class="s" x="306" y="133">after flashing, over USB</text>
  <line class="rule" x1="306" y1="147" x2="484" y2="147"/>
  <text class="s" x="306" y="172">clock, SD-card speed,</text>
  <text class="s" x="306" y="191">sensors, heater,</text>
  <text class="s" x="306" y="210">light ramps, schedule,</text>
  <text class="s" x="306" y="229">camera under the</text>
  <text class="s" x="306" y="248">capture light</text>
  <line class="rule" x1="306" y1="262" x2="484" y2="262"/>
  <text class="s" x="306" y="287">you confirm each step;</text>
  <text class="s" x="306" y="306">then the device is</text>
  <text class="s" x="306" y="325">marked QC&#x27;d</text>
  </a>
  <rect class="repo" x="540" y="70" width="220" height="310" rx="12"/>
  <text class="t" x="556" y="98">DWARPH device</text>
  <text class="s" x="556" y="120">QC&#x27;d, running</text>
  <line class="rule" x1="556" y1="134" x2="744" y2="134"/>
  <text class="s" x="556" y="159">follows its schedule</text>
  <text class="s" x="556" y="178">heats, lights (red, blue,</text>
  <text class="s" x="556" y="197">white)</text>
  <text class="s" x="556" y="221">takes a picture every</text>
  <text class="s" x="556" y="240">few minutes</text>
  <text class="s" x="556" y="264">writes pictures + their</text>
  <text class="s" x="556" y="283">conditions to its SD card</text>
  <text class="s" x="556" y="307">keeps running on its own</text>
  <text class="m" x="556" y="348">schedule.json</text>
  <a href="https://github.com/DWARPHs/DWARPH-commander" target="_blank" rel="noopener">
  <title>DWARPH-commander: https://github.com/DWARPHs/DWARPH-commander</title>
  <rect class="repo" x="800" y="70" width="240" height="150" rx="12"/>
  <text class="t" x="816" y="98">DWARPH-commander</text>
  <text class="s" x="816" y="120">desktop app for the fleet</text>
  <line class="rule" x1="816" y1="134" x2="1024" y2="134"/>
  <text class="s" x="816" y="159">finds devices, live view</text>
  <text class="s" x="816" y="178">sends schedules, start/stop</text>
  <text class="s" x="816" y="197">light calibration, updates</text>
  </a>
  <rect class="data" x="800" y="285" width="240" height="95" rx="12"/>
  <text class="t" x="816" y="313">Device mirror</text>
  <text class="s" x="816" y="335">copy of every SD card</text>
  <text class="m" x="816" y="354">&lt;device&gt;/&lt;day&gt;/*.jpg+.json</text>
  <rect class="planned" x="800" y="445" width="240" height="95" rx="12"/>
  <text class="t" x="816" y="473">DWARPH_DB</text>
  <text class="s" x="816" y="495">local catalogue and viewer</text>
  <text class="s" x="816" y="514">not on GitHub yet</text>
  <a href="https://github.com/DWARPHs/DWARPH-CV" target="_blank" rel="noopener">
  <title>DWARPH-CV: https://github.com/DWARPHs/DWARPH-CV</title>
  <rect class="repo" x="1110" y="70" width="230" height="470" rx="12"/>
  <text class="t" x="1126" y="98">DWARPH-CV</text>
  <text class="s" x="1126" y="120">Python package, dwarph-cv</text>
  <line class="rule" x1="1126" y1="134" x2="1324" y2="134"/>
  <text class="m" x="1126" y="159">annotate</text>
  <text class="s" x="1126" y="178">SAM 2.1 → ground-truth masks</text>
  <text class="m" x="1126" y="209">train</text>
  <text class="s" x="1126" y="228">masks → model weights</text>
  <text class="m" x="1126" y="259">segment</text>
  <text class="s" x="1126" y="278">pictures → duckweed masks</text>
  <text class="m" x="1126" y="309">ring</text>
  <text class="s" x="1126" y="328">camera distance and tilt</text>
  <text class="m" x="1126" y="359">ring-coverage</text>
  <text class="s" x="1126" y="378">% of the ring covered</text>
  <text class="s" x="1126" y="397">= growth over time</text>
  <line class="rule" x1="1126" y1="411" x2="1324" y2="411"/>
  <text class="m" x="1126" y="436">tools/build_dataset.py</text>
  <text class="s" x="1126" y="455">curated images + masks</text>
  <text class="s" x="1126" y="474">→ dataset zip</text>
  </a>
  <a href="https://doi.org/10.5281/zenodo.24164133" target="_blank" rel="noopener">
  <title>Model weights v1.0: https://doi.org/10.5281/zenodo.24164133</title>
