<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" width="1250" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How DWARPH devices, the Commander and the hub connect</title>
  <style>a { cursor: pointer; }</style>
  <!-- generated by scripts/make_project_map.py from its figures/*.yml: edit those, not this -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .col { font-size: 15px; font-weight: 700; fill: #8a929c; letter-spacing: .08em; }
      .repo { fill: #ffffff; stroke: #3f8f29; stroke-width: 2.5; }
      .data { fill: #eef4fb; stroke: #4a78a8; stroke-width: 2; }
      .published { fill: #f5effa; stroke: #7a5aa6; stroke-width: 2; }
      .planned { fill: #ffffff; stroke: #9aa2ab; stroke-width: 2; stroke-dasharray: 7 5; }
      .old { fill: #f3f4f5; stroke: #c3c8cd; stroke-width: 1.5; }
      .t { font-size: 17px; font-weight: 700; fill: #1d2228; }
      .s { font-size: 13.5px; fill: #4a525c; }
      .b { font-size: 13.5px; fill: #4a525c; font-weight: 700; }
      .m { font-size: 13px; fill: #4a525c; font-family: ui-monospace, 'DejaVu Sans Mono', monospace; }
      .flow { stroke: #5b6470; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .uses { stroke: #5b6470; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .l { font-size: 12.5px; fill: #5b6470; font-style: italic; }
      .tag { font-size: 11.5px; font-weight: 700; fill: #7a5aa6; letter-spacing: .04em; }
      .tag-repo { fill: #3f8f29; }
      .tag-planned { fill: #6b7280; }
      .phase { font-size: 15px; font-weight: 700; fill: #5b6470; letter-spacing: .08em; }
      .phase-n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .phase-arrow { stroke: #9aa2ab; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #dfe3e7; }
      a rect { transition: stroke-width .15s; }
      a:hover rect, a:focus rect { stroke-width: 4; }
      a:hover .t, a:focus .t { text-decoration: underline; }
    </style>
  </defs>
  <rect width="1250" height="430" fill="#ffffff"/>
  <text class="col" x="40" y="40">YOUR LAB: ONE LOCAL NETWORK</text>
  <text class="col" x="985" y="40">INTERNET: OPTIONAL</text>
  <rect class="repo" x="40" y="70" width="230" height="78" rx="12"/>
  <text class="t" x="56" y="98">DWARPH device</text>
  <text class="s" x="56" y="120">runs its schedule on its own</text>
  <text class="m" x="56" y="139">dwarph-C4E408</text>
  <rect class="repo" x="40" y="168" width="230" height="78" rx="12"/>
  <text class="t" x="56" y="196">DWARPH device</text>
  <text class="s" x="56" y="218">its own conditions</text>
  <text class="m" x="56" y="237">dwarph-4F4D54</text>
  <rect class="repo" x="40" y="266" width="230" height="78" rx="12"/>
  <text class="t" x="56" y="294">DWARPH device</text>
  <text class="s" x="56" y="316">... as many as you like</text>
  <text class="m" x="56" y="335">dwarph-E41240</text>
  <rect class="data" x="370" y="140" width="240" height="134" rx="12"/>
  <text class="t" x="386" y="168">Wi-Fi router</text>
  <text class="s" x="386" y="190">the network name and</text>
  <text class="s" x="386" y="209">password are in each</text>
  <text class="s" x="386" y="228">device&#x27;s schedule</text>
  <text class="s" x="386" y="247">mDNS must not be blocked</text>
  <a href="https://github.com/DWARPHs/DWARPH-commander" target="_blank" rel="noopener">
  <title>Commander computer: https://github.com/DWARPHs/DWARPH-commander</title>
  <rect class="repo" x="690" y="96" width="240" height="222" rx="12"/>
  <text class="t" x="706" y="124">Commander computer</text>
  <text class="s" x="706" y="146">on the same network</text>
  <line class="rule" x1="706" y1="160" x2="914" y2="160"/>
  <text class="m" x="706" y="185">DWARPH-commander</text>
  <text class="s" x="706" y="204">finds devices, live view,</text>
  <text class="s" x="706" y="223">schedules, start / stop</text>
  <text class="m" x="706" y="248">MQTT broker</text>
  <text class="s" x="706" y="267">live readings (optional)</text>
  <text class="m" x="706" y="292">Device mirror</text>
  <text class="s" x="706" y="311">copies of the SD cards</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-hub" target="_blank" rel="noopener">
  <title>DWARPH-hub: https://github.com/DWARPHs/DWARPH-hub</title>
  <rect class="repo" x="985" y="70" width="235" height="150" rx="12"/>
  <text class="tag tag-repo" x="1001" y="92">OPTIONAL</text>
  <text class="t" x="1001" y="111">DWARPH-hub</text>
  <text class="s" x="1001" y="133">one server for many</text>
  <text class="s" x="1001" y="152">labs: images, analysis,</text>
  <text class="s" x="1001" y="171">projects, viewer</text>
  <text class="m" x="1001" y="190">https://hub.&lt;domain&gt;</text>
  </a>
  <a href="https://github.com/DWARPHs/DWARPH-CV" target="_blank" rel="noopener">
  <title>GPU computer: https://github.com/DWARPHs/DWARPH-CV</title>
  <rect class="repo" x="985" y="290" width="235" height="110" rx="12"/>
  <text class="tag tag-repo" x="1001" y="312">OPTIONAL</text>
  <text class="t" x="1001" y="331">GPU computer</text>
  <text class="s" x="1001" y="353">analyses the hub&#x27;s images</text>
  <text class="m" x="1001" y="372">dwarph-cv worker</text>
  </a>
  <path class="flow" d="M272,109 C296,109 344,173.5 368,173.5" marker-start="url(#arrow)"/>
  <text class="l" x="274" y="100">Wi-Fi</text>
  <path class="flow" d="M272,207 L368,207" marker-start="url(#arrow)"/>
  <path class="flow" d="M272,305 C296,305 344,240.5 368,240.5" marker-start="url(#arrow)"/>
  <path class="flow" d="M612,207 L688,207" marker-start="url(#arrow)"/>
  <text class="l" x="614" y="198">discovery</text>
  <text class="l" x="614" y="229">REST · MQTT</text>
  <path class="uses" d="M930,162.6 C954,162.6 959,145 983,145"/>
  <text class="l" x="934" y="153.6">sync</text>
  <text class="l" x="934" y="184.6">(HTTPS)</text>
  <path class="uses" d="M1102.5,288 L1102.5,222" marker-start="url(#arrow)"/>
  <text class="l" x="1108" y="262"> images ⇄ results</text>
</svg>
